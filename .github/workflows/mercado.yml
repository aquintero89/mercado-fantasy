name: Mercado Fantasy diario

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright pandas requests lxml html5lib beautifulsoup4
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scrape_mercado.py

      - name: Guardar los CSV actualizados en el repositorio
        run: |
          git config user.name "mercado-bot"
          git config user.email "mercado-bot@users.noreply.github.com"
          git add -A
          git commit -m "Actualización diaria del mercado $(date +'%Y-%m-%d')" || echo "Sin cambios que subir"
          git push
